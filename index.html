<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowGrid</title>
    <style>
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 2rem; background: #121212; color: #eee; }
      .container { max-width: 600px; margin: 0 auto; text-align: center; }
      h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #fff; }
      button { padding: 0.75rem 1.5rem; margin: 0.5rem; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; }
      button:hover { background: #0056b3; }
      button:disabled { background: #555; cursor: not-allowed; }
      input { padding: 0.75rem; margin: 0.5rem; width: 80%; max-width: 300px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; }
      .grid { display: grid; grid-template-columns: repeat(10, 40px); grid-gap: 2px; justify-content: center; margin-top: 2rem; }
      .cell { width: 40px; height: 40px; background: #2a2a2a; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; user-select: none; font-size: 0.8rem; font-weight: bold; }
      .cell:hover { background: #3a3a3a; }
      .cell.active { background: #007bff; color: white; }
      #logs { display: none; }
      
      .panel { background: #1e1e1e; padding: 2rem; border-radius: 8px; margin-top: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
      .hidden { display: none !important; }
      .error-text { color: #ff6b6b; margin-bottom: 1rem; font-weight: 500; }
      .status-pill { display: inline-block; padding: 0.25rem 0.75rem; background: #333; border-radius: 99px; font-size: 0.85rem; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ShadowGrid</h1>
      <div id="status-display" class="status-pill hidden">Disconnected</div>

      <!-- Onboarding Panel -->
      <div id="onboarding-panel" class="panel">
        <p>Welcome to ShadowGrid. A Zero-Knowledge multiplayer game on Midnight.</p>
        <div id="wallet-error" class="error-text hidden"></div>
        <button id="connect-btn">Connect Wallet</button>
        <a id="get-lace-btn" href="https://docs.midnight.network/develop/tutorial/using/wallet" target="_blank" class="hidden"><button style="background:#555;">Get Midnight Lace</button></a>
      </div>

      <!-- Lobby Panel -->
      <div id="lobby-panel" class="panel hidden">
        <p>Wallet Connected: <strong id="wallet-addr">...</strong></p>
        <button id="host-btn">Host Game (Deploy)</button>
        <div style="margin: 1.5rem 0; border-top: 1px solid #333; padding-top: 1.5rem;">
          <input type="text" id="contract-input" placeholder="Contract Address" />
          <br/>
          <button id="join-btn">Join Game</button>
        </div>
      </div>

      <!-- Game Panel -->
      <div id="game-panel" class="panel hidden">
        <p>Contract: <strong id="contract-addr">...</strong></p>
        <div class="grid" id="game-grid"></div>
      </div>
      
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
