<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowGrid MVP</title>
    <style>
      body { font-family: sans-serif; padding: 2rem; background: #1a1a1a; color: #fff; }
      .container { max-width: 800px; margin: 0 auto; }
      button { padding: 0.5rem 1rem; margin: 0.5rem; cursor: pointer; background: #333; color: white; border: 1px solid #555; }
      button:hover { background: #444; }
      input { padding: 0.5rem; margin: 0.5rem; width: 300px; background: #222; color: #fff; border: 1px solid #555; }
      .grid { display: grid; grid-template-columns: repeat(10, 40px); grid-gap: 2px; margin-top: 1rem; }
      .cell { width: 40px; height: 40px; background: #333; display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .cell:hover { background: #555; }
      .cell.active { background: #007bff; }
      #logs { margin-top: 1rem; padding: 1rem; background: #000; color: #0f0; font-family: monospace; white-space: pre-wrap; height: 200px; overflow-y: auto; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ShadowGrid MVP</h1>
      <div id="controls">
        <button id="connect-btn">Connect Wallet</button>
        <button id="host-btn" disabled>Host Game (Deploy)</button>
        <br />
        <input type="text" id="contract-input" placeholder="Contract Address" />
        <button id="join-btn" disabled>Join Game</button>
      </div>
      <div>
        <p>Status: <span id="status-text">Disconnected</span></p>
        <p>Wallet: <span id="wallet-addr">None</span></p>
        <p>Contract: <span id="contract-addr">None</span></p>
      </div>
      <div class="grid" id="game-grid">
        <!-- Generated by JS -->
      </div>
      <div id="logs"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
