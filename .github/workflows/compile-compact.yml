name: Compile Compact and Test

on:
  push:
    branches:
      - test/feature-multiplayer-indexing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Compact
        uses: midnightntwrk/setup-compact-action@836895ce869bbd51381395f1be6d5b03517178de
        with:
          version: '0.31.1'

      - name: Compile Compact Contract
        id: compile
        run: |
          npx compactc shadowgrid.compact > compile-output.txt 2>&1 || echo "compile_failed=true" >> \
          cat compile-output.txt
          
      - name: Commit test results
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add compile-output.txt
          git commit -m "ci: push error logs" || echo "No changes to commit"
          git push
