
name: Compile Compact Contract

on:
  push:
    branches: [ main, "test/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm ci

      - name: Fetch compactc v0.31.1
        run: npx fetch-compactc
        env:
          COMPACTC_VERSION: "0.31.1"

      - name: Compile test contract
        run: npx run-compactc isolated_test.compact dist
        env:
          COMPACTC_VERSION: "0.31.1"

      - name: Run Runtime Verification Tests
        run: npx ts-node --transpile-only run-test.ts

