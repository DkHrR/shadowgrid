name: Compile Compact Contract

on:
  push:
    branches: [ main, "test/*" ]
    paths:
      - '**.compact'
      - '.github/workflows/compile-compact.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Matching your local version
          
      - name: Install dependencies
        run: npm ci

      - name: Fetch compactc v0.31.1
        run: npx fetch-compactc
        env:
          COMPACTC_VERSION: "0.31.1"

      - name: Compile shadowgrid.compact
        run: npx run-compactc shadowgrid.compact dist
        env:
          COMPACTC_VERSION: "0.31.1"

      - name: Upload Compilation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compact-artifacts
          path: dist/
